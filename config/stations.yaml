# VERDAD radio stations -- the single source of truth for what gets recorded.
#
# Fields
#   code      Station call sign as stored in audio_files.radio_station_code. Must be unique;
#             it is also the Prefect deployment name, so changing it orphans the deployment.
#   name      Human-readable station name (audio_files.radio_station_name).
#   url       Stream URL (direct recorders) or web player page (generic recorder). Must be unique.
#             The R2 prefix is radio_<last 6 hex of sha256(url)>/, so changing a URL moves its audio.
#   state     US state (or "Russia"/"International" for the two non-US streams).
#   recorder  Which recorder records this station. This is a TOPOLOGY fact tied to the fly.*.toml
#             files, not a preference -- it selects the Fly machine, its memory sizing and its
#             Dockerfile, and it only takes effect on deploy:
#               max      -> recording-worker / max_recorder    (ffmpeg, fly.recording_worker.toml)
#               lite     -> recording-worker / lite_recorder   (ffmpeg, fly.recording_worker.toml)
#               generic  -> generic-recording-worker           (Chrome + PulseAudio,
#                                                               fly.generic_recording_worker.toml)
#   enabled   Set to false to stop creating a deployment and stop triggering runs for a station.
#             Defaults to true.
#
# Generic stations only
#   process_group  The FLY_PROCESS_GROUP value of the machine that records this station. Must match
#                  a [processes] entry in fly.generic_recording_worker.toml.
#   driver         PulseAudio sink/source names (unique per station) and the CSS selectors the
#                  Selenium driver uses on the web player page.
#
# See docs/OPERATIONS.md, "Adding or disabling a station".

