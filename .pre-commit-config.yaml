# Install once with: pip install pre-commit && pre-commit install
# Runs only on the files staged in the commit. No ruff-format hook: the repo is not fully formatted yet (AGENTS.md).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
