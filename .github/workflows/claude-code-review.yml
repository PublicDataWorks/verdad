name: Claude Code Review

# Once per PR; re-review on demand with an "@claude review" comment (claude.yml).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Public repo: fork and dependabot PRs get no secrets, so skip rather than fail.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@6c8496521684092498afe8683c9a6430babc6b9f # v1.0.223
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PRs from Claude Code on the web are authored by claude[bot]; the action rejects bot actors otherwise.
          allowed_bots: "claude[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Plugin's allowed-tools plus read-only gh api/git, which it calls in practice; deny gh api write flags.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh api repos/${{ github.repository }}/pulls/*),Bash(gh api repos/${{ github.repository }}/issues/*),Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Bash(gh api *-X*),Bash(gh api *--method*),Bash(gh api * -f*),Bash(gh api * -F*),Bash(gh api *--field*),Bash(gh api *--raw-field*),Bash(gh api *--input*)"
            --append-system-prompt "This runs in GitHub Actions, so the CLAUDE.md note about the cloud proxy rejecting gh pr does not apply: read with gh pr view and gh pr diff, post with gh pr comment. Use gh api only for GET reads of this repository's pulls and issues."
