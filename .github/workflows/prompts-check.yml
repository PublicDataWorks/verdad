name: Prompts check

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/scripts/**"
      - "tests/test_evaluate_prompt.py"
      - "tests/test_prompt_manifest.py"
      - "tests/test_import_prompts_diff.py"
      - ".github/workflows/prompts-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (harness and manifest)
        run: |
          python -m pytest tests/test_evaluate_prompt.py tests/test_prompt_manifest.py --no-cov
          # The prompt drift test ships with PR #70; run it only once it exists on this branch.
          if [ -f tests/test_import_prompts_diff.py ]; then
            python -m pytest tests/test_import_prompts_diff.py --no-cov
          else
            echo "::notice::tests/test_import_prompts_diff.py not present; skipping"
          fi

      - name: Manifest vs database (dry run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PYTHONPATH: .:src
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_KEY secrets not available; skipping manifest dry run"
            exit 0
          fi
          python src/scripts/import_prompts_to_db.py import --from-manifest --dry-run
