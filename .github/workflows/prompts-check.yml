name: Prompts check

on:
  pull_request:
    paths:
      - "prompts/**"
      - "src/scripts/**"
      - "tests/test_evaluate_prompt.py"
      - "tests/test_prompt_manifest.py"
      - "tests/test_import_prompts_diff.py"
      - "tests/test_post_pr_comment.py"
      - "scripts/ci/**"
      - ".github/workflows/prompts-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (harness, manifest, CI helpers)
        run: |
          python -m pytest tests/test_evaluate_prompt.py tests/test_prompt_manifest.py tests/test_post_pr_comment.py --no-cov
          # The prompt drift test ships with PR #70; run it only once it exists on this branch.
          if [ -f tests/test_import_prompts_diff.py ]; then
            python -m pytest tests/test_import_prompts_diff.py --no-cov
          else
            echo "::notice::tests/test_import_prompts_diff.py not present; skipping"
          fi

      - name: Shell syntax
        run: bash -n scripts/ci/fly_prompt_job.sh scripts/ci/run_prompt_job.sh
