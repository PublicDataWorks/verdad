name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Run flows/tasks as plain functions; tests/conftest.py supplies the dummy service credentials.
      ENABLE_PREFECT_DECORATOR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (pydub-based stage 2 tests decode real mp3s)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: pytest

  server:
    # server/ is the Express app (Liveblocks auth, Resend email); Node 20 matches server/Dockerfile.server.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Type-check the tests too (excluded from the build config so they stay out of dist/)
        run: npx tsc -p tsconfig.test.json
      - run: npm test
