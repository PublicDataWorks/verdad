name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Run flows/tasks as plain functions; tests/conftest.py supplies the dummy service credentials.
      ENABLE_PREFECT_DECORATOR: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (pydub-based stage 2 tests decode real mp3s)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: pip install -r requirements.txt
      - run: ruff check src tests scripts
      - run: pytest
