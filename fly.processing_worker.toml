app = 'processing-worker'
primary_region = 'sea'

[build]
  dockerfile = 'Dockerfile.processing_worker'

[env]
  PREFECT_API_URL = 'https://prefect.fly.dev/api'

[processes]
  initial_disinformation_detection = ''
  initial_disinformation_detection_2 = ''
  audio_clipping = ''
  in_depth_analysis = ''
  regenerate_timestamped_transcript = ''
  redo_main_detection = ''
  undo_disinformation_detection = ''
  undo_audio_clipping = ''
  analysis_review = ''
  analysis_review_2 = ''
  embedding = ''

[[vm]]
  processes = ["initial_disinformation_detection", "initial_disinformation_detection_2"]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 8

  [[vm]]
  processes = ["audio_clipping"]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4


[[vm]]
  # 5 Stage 3 loops plus targeted by-id runs OOM-killed the 2gb machine on 2026-09-16
  processes = ["in_depth_analysis"]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 8

[[vm]]
  processes = ["analysis_review", "analysis_review_2"]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 8

[[vm]]
  processes = ["regenerate_timestamped_transcript", "embedding"]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 4

[[vm]]
  processes = ["redo_main_detection", "undo_audio_clipping", "undo_disinformation_detection"]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# Restart on every exit, without a retry cap (VER-429). The default (on-failure, max 10 retries) used up
# its retries while Postgres was down during Fly's host reboots on 2026-10-16 and left the machines
# stopped for 3 hours, until restart_all.sh restarted them.
# Only the always-on groups (the ones in the FLY_MACHINE_IDS secret). The others are on-demand machines that
# are started by hand and stay stopped otherwise; they keep Fly's default.
[[restart]]
  policy = "always"
  processes = ["initial_disinformation_detection", "audio_clipping", "in_depth_analysis", "analysis_review", "embedding"]
