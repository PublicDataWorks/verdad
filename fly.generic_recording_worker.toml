app = 'generic-recording-worker'
primary_region = 'sea'

[build]
  dockerfile = 'Dockerfile.generic_recording_worker'

[env]
  PREFECT_API_URL = 'https://prefect.fly.dev/api'

[processes]
  radio_khot = ''
  radio_kisf = ''
  radio_krgt = ''
  radio_wkaq = ''
  radio_wado = ''
  radio_waqi = ''

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

[scale]
  radio_khot = 1
  radio_kisf = 1
  radio_krgt = 1
  radio_wkaq = 1
  radio_wado = 1
  radio_waqi = 1

# Restart on every exit, without a retry cap (VER-429). The default (on-failure, max 10 retries) used up
# its retries while Postgres was down during Fly's host reboots on 2026-10-16 and left the machines
# stopped for 3 hours, until restart_all.sh restarted them.
[[restart]]
  policy = "always"
