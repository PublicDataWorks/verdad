[project]
name = "verdad"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
# Repo root on sys.path so tests can import `src.scripts.*` (tests/conftest.py adds `src/` itself).
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
show_missing = true
# Actual coverage at the time of setting; ratchet upward, never down.
fail_under = 75

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs", "htmlcov", "searxng", "server", "supabase"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
# "I" (import sorting) is deliberately off for now: enabling it re-sorts imports in ~40 files.
# Turn it on in a dedicated formatting-only commit once in-flight branches have landed.

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
